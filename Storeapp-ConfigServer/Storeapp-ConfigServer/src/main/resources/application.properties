spring.application.name=Storeapp-ConfigServer

server.port=8888

spring.cloud.config.server.git.uri=https://github.com/Dhaarani09/central-config
spring.cloud.config.server.git.username=
spring.cloud.config.server.git.password=

spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.basedirectory=file://${user.dir}/cloned_configurations

management.endpoints.web.exposure.include=busrefresh

spring.rabbitmq.host=localhost
spring.rabbitmq,port=15672

spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
